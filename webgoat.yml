# Script-owned deployment template for OWASP WebGoat (+ WebWolf, bundled in the same image).
# Upstream reference: https://github.com/WebGoat/WebGoat (README -> "Run using Docker":
#   docker run -it -p 127.0.0.1:8080:8080 -p 127.0.0.1:9090:9090 webgoat/webgoat)
# WebGoat serves on 8080 (/WebGoat) and WebWolf on 9090 (/WebWolf) inside the container.
services:
  webgoat:
    image: ${LAB_IMAGE_WEBGOAT:-webgoat/webgoat:latest}
    container_name: owasplab-webgoat
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_WEBGOAT_HTTP:-8080}:8080"
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_WEBWOLF_HTTP:-9090}:9090"
    environment:
      - TZ=${LAB_TZ:-UTC}
    security_opt:
      - no-new-privileges:true
    restart: "no"
