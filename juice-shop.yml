# Script-owned deployment template for OWASP Juice Shop.
# Upstream reference: https://github.com/juice-shop/juice-shop (README -> "Docker Container":
#   docker run --rm -p 127.0.0.1:3000:3000 bkimminich/juice-shop)
# Host binding is localhost-only by default (LAB_BIND). No privileged mode, no host mounts.
services:
  juice-shop:
    image: ${LAB_IMAGE_JUICE_SHOP:-bkimminich/juice-shop:latest}
    container_name: owasplab-juice-shop
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_JUICE_SHOP:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    restart: "no"
